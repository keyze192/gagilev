{% extends "index.html" %}
{% block content %}

<section class="search-filters">
    <div class="container">
        <div class="search-filters-row">
            <div class="search-container">
                <div class="search-box-minimal">
                    <i class="fas fa-search"></i>
                    <input type="text" id="caseSearch" placeholder="Найти кейсы...">
                    <button class="clear-search" style="display: none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <div class="filters-minimal">
                <div class="filter-select-wrapper">
                    <select id="priceFilter" class="filter-select">
                        <option value="all">Цена</option>
                        <option value="0-500">До 500 ₽</option>
                        <option value="500-1000">500-1000 ₽</option>
                        <option value="1000-5000">1000-5000 ₽</option>
                        <option value="5000+">От 5000 ₽</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
                
                <div class="filter-select-wrapper">
                    <select id="rarityFilter" class="filter-select">
                        <option value="all">Все кейсы</option>
                        <option value="common">Обычные</option>
                        <option value="rare">Редкие</option>
                        <option value="epic">Эпические</option>
                        <option value="legendary">Легендарные</option>
                        <option value="ancient">Древние</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
                
                <div class="filter-select-wrapper">
                    <select id="sortFilter" class="filter-select">
                        <option value="popular">Сортировка</option>
                        <option value="price-asc">Цена ↑</option>
                        <option value="price-desc">Цена ↓</option>
                        <option value="name">По названию</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
                
                <button class="filter-reset-minimal" title="Сбросить фильтры">
                    <i class="fas fa-redo-alt"></i>
                </button>
            </div>
        </div>
        
        <div class="active-filters-minimal"></div>
        
 
        <div class="loading-indicator" id="loadingIndicator">
            <i class="fas fa-spinner fa-spin"></i> Загрузка...
        </div>
    </div>
</section>

<main>
    <section class="cases-section">
        <div class="container">
            <h2 class="section-title">Популярные кейсы</h2>
 
            <div class="cases-grid" id="casesContainer">
                {% for case in popular_cases %}
                <div class="case-card">
                    <div class="case-image">
                        {% if case.image %}
                            <img src="{{ case.image.url }}" alt="{{ case.name }}">
                        {% else %}
                            <i class="fas fa-box"></i>
                        {% endif %}
                    </div>
                    <div class="case-name">{{ case.name }}</div>
                    <div class="case-price">{{ case.price }} ₽</div>
                    <a href="{% url 'case_detail' case.id %}" class="btn">
                        <i class="fas fa-gift"></i> Открыть
                    </a>
                </div>
                {% endfor %}
            </div>
            
 
            <div id="noResults" style="display: none; text-align: center; padding: 50px;">
                <i class="fas fa-search" style="font-size: 48px; color: var(--text-secondary); margin-bottom: 20px;"></i>
                <h3 style="color: var(--text-color); margin-bottom: 10px;">Кейсы не найдены</h3>
                <p style="color: var(--text-secondary);">Попробуйте изменить параметры поиска</p>
            </div>
        </div>
    </section>
</main>
{% endblock %}
