{% extends "index.html" %}
{% block content %}

<section class="search-filters">
    <div class="container">
        <div class="search-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="caseSearch" placeholder="Поиск кейсов...">
                <button class="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
        
        <div class="filters-section">
            <div class="filter-group">
                <label for="priceFilter">Цена:</label>
                <select id="priceFilter">
                    <option value="all">Любая цена</option>
                    <option value="0-500">До 500 ₽</option>
                    <option value="500-1000">500 - 1000 ₽</option>
                    <option value="1000-5000">1000 - 5000 ₽</option>
                    <option value="5000+">От 5000 ₽</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="rarityFilter">Кейсы:</label>
                <select id="rarityFilter">
                    <option value="all">Все кейсы</option>
                    <option value="common">Популярные кейсы</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="sortFilter">Сортировка:</label>
                <select id="sortFilter">
                    <option value="popular">По популярности</option>
                    <option value="price-asc">Цена: по возрастанию</option>
                    <option value="price-desc">Цена: по убыванию</option>
                    <option value="name">По названию</option>
                </select>
            </div>
            
            <div class="filter-group">
                <button class="filter-reset btn-secondary">
                    <i class="fas fa-redo"></i>
                    Сбросить
                </button>
            </div>
        </div>
        
        <div class="active-filters">
        </div>
    </div>
</section>
<main>
    <section class="cases-section">
        <div class="container">
            <h2 class="section-title">Популярные кейсы</h2>
            <div class="cases-grid">
                <div class="case-card">
                    <div class="case-image">
                        <img src="../static/image/middle-68f0bb3eebc6f.png" alt="" class="fas fa-box">
                    </div>
                    <div class="case-name">Боевой кейс</div>
                    <div class="case-price">100 ₽</div>
                    <button class="btn">Открыть</button>
                </div>
                <div class="case-card">
                    <div class="case-image">
                        <img src="../static/image/middle-68d6995dba93c.png" alt="" class="fas fa-box">
                    </div>
                    <div class="case-name">Премиум кейс</div>
                    <div class="case-price">500 ₽</div>
                    <button class="btn">Открыть</button>
                </div>
                <div class="case-card">
                    <div class="case-image">
                        <img src="../static/image/middle-68bae5f9ed245.png" alt="" class="fas fa-box">
                    </div>
                    <div class="case-name">Легендарный кейс</div>
                    <div class="case-price">1000 ₽</div>
                    <button class="btn">Открыть</button>
                </div>
                 <div class="case-card">
                    <div class="case-image">
                        <img src="../static/image/middle-67e6ac2e63259.png" alt="" class="fas fa-box">
                    </div>
                    <div class="case-name">Летний кейс</div>
                    <div class="case-price">10000 ₽</div>
                    <button class="btn">Открыть</button>
                </div>
                                 <div class="case-card">
                    <div class="case-image">
                        <img src="../static/image/middle-63e3b3a55b536.png" alt="" class="fas fa-box">
                    </div>
                    <div class="case-name">Забивной кейс</div>
                    <div class="case-price">777 ₽</div>
                    <button class="btn">Открыть</button>
                </div>
                                 <div class="case-card">
                    <div class="case-image">
                        <img src="../static/image/middle-63e3afecc83e7.png" alt="" class="fas fa-box">
                    </div>
                    <div class="case-name">Крутой кейс</div>
                    <div class="case-price">666 ₽</div>
                    <button class="btn">Открыть</button>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock %}
