{% extends "index.html" %}
{% block content %}

<section class="search-filters">
    <div class="container">
        <div class="search-filters-row">
            <div class="search-container">
                <div class="search-box-minimal">
                    <i class="fas fa-search"></i>
                    <input type="text" id="caseSearch" placeholder="Найти кейсы...">
                    <button class="clear-search" style="display: none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <div class="filters-minimal">
                <div class="filter-select-wrapper">
                    <select id="priceFilter" class="filter-select">
                        <option value="all">Цена</option>
                        <option value="0-500">До 500 ₽</option>
                        <option value="500-1000">500-1000 ₽</option>
                        <option value="1000-5000">1000-5000 ₽</option>
                        <option value="5000+">От 5000 ₽</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
                
                <div class="filter-select-wrapper">
                    <select id="rarityFilter" class="filter-select">
                        <option value="all">Все кейсы</option>
                        <option value="common">Обычные</option>
                        <option value="rare">Редкие</option>
                        <option value="epic">Эпические</option>
                        <option value="legendary">Легендарные</option>
                        <option value="ancient">Древние</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
                
                <div class="filter-select-wrapper">
                    <select id="sortFilter" class="filter-select">
                        <option value="popular">Сортировка</option>
                        <option value="price-asc">Цена ↑</option>
                        <option value="price-desc">Цена ↓</option>
                        <option value="name">По названию</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
                
                <button class="filter-reset-minimal" title="Сбросить фильтры">
                    <i class="fas fa-redo-alt"></i>
                </button>
            </div>
        </div>
        
        <div class="active-filters-minimal"></div>
        
 
        <div class="loading-indicator" id="loadingIndicator">
            <i class="fas fa-spinner fa-spin"></i> Загрузка...
        </div>
    </div>
</section>

<main>
    <section class="cases-section">
        <div class="container">
            <h2 class="section-title">Популярные кейсы</h2>
 
            <div class="cases-grid" id="casesContainer">
                {% for case in popular_cases %}
                <div class="case-card">
                    <div class="case-image">
                        {% if case.image %}
                            <img src="{{ case.image.url }}" alt="{{ case.name }}">
                        {% else %}
                            <i class="fas fa-box"></i>
                        {% endif %}
                    </div>
                    <div class="case-name">{{ case.name }}</div>
                    <div class="case-price">{{ case.price }} ₽</div>
                    <a href="{% url 'case_detail' case.id %}" class="btn">
                        <i class="fas fa-gift"></i> Открыть
                    </a>
                </div>
                {% endfor %}
            </div>
            
 
            <div id="noResults" style="display: none; text-align: center; padding: 50px;">
                <i class="fas fa-search" style="font-size: 48px; color: var(--text-secondary); margin-bottom: 20px;"></i>
                <h3 style="color: var(--text-color); margin-bottom: 10px;">Кейсы не найдены</h3>
                <p style="color: var(--text-secondary);">Попробуйте изменить параметры поиска</p>
            </div>
        </div>
    </section>
</main>


<script>
document.addEventListener('DOMContentLoaded', function() {

    const searchInput = document.getElementById('caseSearch');
    const clearSearch = document.querySelector('.clear-search');
    const filterReset = document.querySelector('.filter-reset-minimal');
    const priceFilter = document.getElementById('priceFilter');
    const rarityFilter = document.getElementById('rarityFilter');
    const sortFilter = document.getElementById('sortFilter');
    const casesContainer = document.getElementById('casesContainer');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const noResults = document.getElementById('noResults');
    const activeFiltersContainer = document.querySelector('.active-filters-minimal');
    
   
    let searchTimeout;
  
    let isLoading = false;
    

    loadCases();
    

    if (searchInput) {
        searchInput.addEventListener('input', function() {
            if (clearSearch) {
                clearSearch.style.display = this.value ? 'flex' : 'none';
            }
            
  
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadCases();
                updateActiveFilters();
            }, 300);
        });
    }
    
    if (clearSearch) {
        clearSearch.addEventListener('click', function() {
            searchInput.value = '';
            this.style.display = 'none';
            searchInput.focus();
            loadCases();
            updateActiveFilters();
        });
    }
    
    if (filterReset) {
        filterReset.addEventListener('click', resetAllFilters);
    }
    
    if (priceFilter) {
        priceFilter.addEventListener('change', function() {
            loadCases();
            updateActiveFilters();
        });
    }
    
    if (rarityFilter) {
        rarityFilter.addEventListener('change', function() {
            loadCases();
            updateActiveFilters();
        });
    }
    
    if (sortFilter) {
        sortFilter.addEventListener('change', function() {
            loadCases();
        });
    }
    

    function loadCases() {
        if (isLoading) return;
        
        isLoading = true;
        showLoading(true);

        const params = new URLSearchParams();
        params.append('search', searchInput ? searchInput.value : '');
        params.append('price', priceFilter ? priceFilter.value : 'all');
        params.append('rarity', rarityFilter ? rarityFilter.value : 'all');
        params.append('sort', sortFilter ? sortFilter.value : 'popular');
        
  
        fetch(`/filter-cases/?${params.toString()}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    renderCases(data.cases);
                } else {
                    showError('Ошибка при загрузке кейсов');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('Произошла ошибка при загрузке');
            })
            .finally(() => {
                isLoading = false;
                showLoading(false);
            });
    }
    

    function renderCases(cases) {
        if (cases.length === 0) {
            casesContainer.style.display = 'none';
            noResults.style.display = 'block';
            return;
        }
        
        casesContainer.style.display = 'grid';
        noResults.style.display = 'none';
        
        let html = '';
        cases.forEach(caseData => {
            html += `
                <div class="case-card">
                    <div class="case-image">
                        ${caseData.image_url ? 
                            `<img src="${caseData.image_url}" alt="${caseData.name}">` : 
                            `<i class="fas fa-box"></i>`
                        }
                    </div>
                    <div class="case-name">${caseData.name}</div>
                    <div class="case-price">${caseData.price} ₽</div>
                    <a href="${caseData.url}" class="btn">
                        <i class="fas fa-gift"></i> Открыть
                    </a>
                </div>
            `;
        });
        
        casesContainer.innerHTML = html;
    }

    function updateActiveFilters() {
        if (!activeFiltersContainer) return;
        
        activeFiltersContainer.innerHTML = '';
        

        if (searchInput && searchInput.value) {
            const searchTag = createFilterTag(`Поиск: "${searchInput.value}"`, () => {
                searchInput.value = '';
                if (clearSearch) clearSearch.style.display = 'none';
                loadCases();
            });
            activeFiltersContainer.appendChild(searchTag);
        }

        if (priceFilter && priceFilter.value !== 'all') {
            const priceText = getPriceFilterText(priceFilter.value);
            const priceTag = createFilterTag(`Цена: ${priceText}`, () => {
                priceFilter.value = 'all';
                loadCases();
            });
            activeFiltersContainer.appendChild(priceTag);
        }
        

        if (rarityFilter && rarityFilter.value !== 'all') {
            const rarityText = rarityFilter.options[rarityFilter.selectedIndex].text;
            const rarityTag = createFilterTag(`Кейсы: ${rarityText}`, () => {
                rarityFilter.value = 'all';
                loadCases();
            });
            activeFiltersContainer.appendChild(rarityTag);
        }
    }
    
    function createFilterTag(text, onClick) {
        const tag = document.createElement('div');
        tag.className = 'filter-tag-minimal';
        
        const textSpan = document.createElement('span');
        textSpan.textContent = text;
        
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-filter';
        removeBtn.innerHTML = '<i class="fas fa-times"></i>';
        removeBtn.addEventListener('click', onClick);
        
        tag.appendChild(textSpan);
        tag.appendChild(removeBtn);
        
        return tag;
    }
    
    function getPriceFilterText(value) {
        switch (value) {
            case '0-500': return 'до 500 ₽';
            case '500-1000': return '500-1000 ₽';
            case '1000-5000': return '1000-5000 ₽';
            case '5000+': return 'от 5000 ₽';
            default: return '';
        }
    }
    
    function resetAllFilters() {
 
        if (searchInput) searchInput.value = '';
        if (clearSearch) clearSearch.style.display = 'none';
        
  
        if (priceFilter) priceFilter.value = 'all';
        if (rarityFilter) rarityFilter.value = 'all';
        if (sortFilter) sortFilter.value = 'popular';
        

        loadCases();
        updateActiveFilters();
    }
    
    function showLoading(show) {
        if (loadingIndicator) {
            if (show) {
                loadingIndicator.classList.add('active');
            } else {
                loadingIndicator.classList.remove('active');
            }
        }
    }
    
    function showError(message) {
        console.error(message);
    }
});
</script>

{% endblock %}
